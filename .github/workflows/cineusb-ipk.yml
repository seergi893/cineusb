name: Build and publish CineUSB

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/cineusb-ipk.yml
      - ci/check-package.py
      - pkg/appinfo.json
      - ipkroot/ctl/control
      - rust-modules/Cargo.toml
      - rust-modules/Cargo.lock
      - rust-modules/src/app/local_usb/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cineusb-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  usb-smoke:
    if: github.repository == 'seergi893/cineusb'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - name: Install USB test dependencies
        id: usb-deps
        run: |
          if ! command -v ffmpeg || ! command -v nasm || ! pkg-config --exists sdl2 SDL2_ttf gl; then
            # Avoid the runner's Azure mirror+file source, which can hang for
            # many minutes on DNS failures. Use a dedicated Ubuntu 24.04 source.
            sources="$RUNNER_TEMP/cineusb-ubuntu.sources"
            cat > "$sources" <<'APT_SOURCES'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          APT_SOURCES
            apt_options=(
              -o "Dir::Etc::sourcelist=$sources"
              -o "Dir::Etc::sourceparts=-"
              -o Acquire::ForceIPv4=true
              -o Acquire::Retries=0
              -o Acquire::http::Timeout=12
              -o Acquire::https::Timeout=12
            )
            # Fail promptly on runner-wide DNS outages rather than retrying APT
            # for the entire job timeout. A new runner may resolve transient DNS.
            if ! timeout 12s getent ahostsv4 archive.ubuntu.com >/dev/null; then
              echo "::warning::Runner DNS unavailable; USB smoke tests cannot run. The package build remains independent."
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "### USB smoke tests NOT RUN" >> "$GITHUB_STEP_SUMMARY"
              echo "Runner DNS could not resolve archive.ubuntu.com; required host dependencies were unavailable. This is not a passing test result." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            for attempt in 1 2; do
              echo "APT dependency setup attempt $attempt/2 (90s maximum per command)"
              if sudo timeout 90s apt-get "${apt_options[@]}" update -o APT::Update::Error-Mode=any &&
                 sudo timeout 90s env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install --no-install-recommends -y ffmpeg nasm libsdl2-dev libsdl2-ttf-dev libgl1-mesa-dev; then
                break
              fi
              if [ "$attempt" -eq 2 ]; then
                echo "::warning::Ubuntu dependencies unavailable; USB smoke tests cannot run. Check runner network/APT logs."
                echo "available=false" >> "$GITHUB_OUTPUT"
                echo "### USB smoke tests NOT RUN" >> "$GITHUB_STEP_SUMMARY"
                echo "Host dependencies could not be installed; no USB smoke tests were executed. This is not a passing test result." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              sleep 5
            done
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Test local MKV and MP4 with the bundled FFmpeg configuration
        if: steps.usb-deps.outputs.available == 'true'
        run: |
          HOST=1 RELEASE=1 ci/build-ffmpeg.sh
          export PLXNATIVE_APP_DIR="$PWD/vendor/ffmpeg-prefix-host/lib"
          export CINEUSB_FD_FIXTURES="$RUNNER_TEMP/cineusb-fd-fixtures"
          mkdir -p "$CINEUSB_FD_FIXTURES"
          for ext in mkv mp4; do
            ffmpeg -nostdin -v error -f lavfi -i color=size=160x90:rate=24 \
              -f lavfi -i anullsrc=r=48000:cl=stereo -t 1 -c:v libx264 -c:a aac \
              -color_trc bt709 -colorspace bt709 -color_primaries bt709 \
              "$CINEUSB_FD_FIXTURES/Película.$ext"
          done
          printf '1\n00:00:00,100 --> 00:00:00,800\nFull subtitle\n' > "$CINEUSB_FD_FIXTURES/full.srt"
          printf '1\n00:00:00,200 --> 00:00:00,900\nSigns subtitle\n' > "$CINEUSB_FD_FIXTURES/signs.srt"
          ffmpeg -nostdin -v error -f lavfi -i color=size=160x90:rate=24 \
            -f lavfi -i anullsrc=r=48000:cl=stereo \
            -i "$CINEUSB_FD_FIXTURES/full.srt" -i "$CINEUSB_FD_FIXTURES/signs.srt" \
            -t 1 -map 0:v -map 1:a -map 2:0 -map 3:0 \
            -c:v libx264 -c:a aac -c:s srt \
            -metadata:s:s:0 language=spa -metadata:s:s:0 title=Full \
            -metadata:s:s:1 language=eng -metadata:s:s:1 title=Signs \
            -disposition:s:0 default -disposition:s:1 forced \
            "$CINEUSB_FD_FIXTURES/subtitled.mkv"
          printf 'Not a Matroska file\n' > "$CINEUSB_FD_FIXTURES/invalid.mkv"
          cd rust-modules
          CARGO_INCREMENTAL=0 cargo +"$RUST_TOOLCHAIN" test --locked -p plx_play_feed --lib --features plx_base/hostsim \
            cineusb_ -- --nocapture
          CARGO_INCREMENTAL=0 cargo +"$RUST_TOOLCHAIN" test --locked -p plxnative-storage --bin plxnative-storage usb_
      - name: Test USB video menu and startup subtitles
        if: steps.usb-deps.outputs.available == 'true'
        run: |
          cd rust-modules
          CARGO_INCREMENTAL=0 cargo +"$RUST_TOOLCHAIN" test --locked -p plxnative-modules --lib \
            --features hostsim,local-usb usb_browser_tests::
          CARGO_INCREMENTAL=0 cargo +"$RUST_TOOLCHAIN" test --locked -p plxnative-modules -p plx_appkit --lib \
            --features hostsim,local-usb cineusb_finish_label
      - name: Lint the USB storage helper
        if: steps.usb-deps.outputs.available == 'true'
        working-directory: rust-modules
        run: |
          cargo +"$RUST_TOOLCHAIN" clippy --locked -p plxnative-storage --tests -- \
            -A clippy::all \
            -D clippy::ifs_same_cond -D clippy::same_functions_in_if_condition -D clippy::if_same_then_else
  package:
    if: ${{ !cancelled() && github.repository == 'seergi893/cineusb' && (github.event_name == 'pull_request' || needs.usb-smoke.result == 'success') }}
    needs: usb-smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      FLAVOR: stable
      RELEASE: "1"
      PLX_SENTRY_DSN: ""
      PLX_POSTHOG_KEY: ""
      PLX_SENTRY_DSN_DEV: ""
      PLX_POSTHOG_KEY_DEV: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/webos-ndk
        id: ndk
      - name: Compile and verify the webOS package
        env:
          WEBOS_SDK: ${{ steps.ndk.outputs.sdk-dir }}
        run: |
          make -j"$(nproc)" all
          make ipk
      - name: Upload the test IPK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cineusb-webos-arm
          path: pkg/com.seergi893.cineusb_*_arm.ipk
          if-no-files-found: error
      - name: Generate and verify the Homebrew manifest
        if: github.ref == 'refs/heads/main'
        run: |
          packages=$(python3 ci/deps.py fetch webosbrew-toolbox --asset fw-symbols --asset ipk-verify --asset gen-manifest)
          mapfile -t debs <<< "$packages"
          sudo apt-get install -y "${debs[@]}"
          ipks=(pkg/com.seergi893.cineusb_*_arm.ipk)
          test "${#ipks[@]}" = 1
          ipk="${ipks[0]}"
          webosbrew-ipk-verify --details --format markdown --fw-releases '>=4.0' "$ipk" | tee "$GITHUB_STEP_SUMMARY"
          manifest=pkg/com.seergi893.cineusb.manifest.json
          webosbrew-gen-manifest -p "$ipk" \
            -i "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/pkg/largeIcon.png" \
            -l "https://github.com/$GITHUB_REPOSITORY" -r true -o "$manifest"
          python3 - "$ipk" "$manifest" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          ipk, manifest = map(Path, sys.argv[1:])
          info = json.loads(manifest.read_text())
          assert info["id"] == "com.seergi893.cineusb"
          assert ipk.name == f'{info["id"]}_{info["version"]}_arm.ipk'
          assert info["ipkUrl"] == ipk.name
          assert info["ipkHash"]["sha256"] == hashlib.sha256(ipk.read_bytes()).hexdigest()
          assert info["rootRequired"] is True
          PY
      - name: Prepare matching source and build instructions
        if: github.ref == 'refs/heads/main'
        env:
          WEBOS_SDK: ${{ steps.ndk.outputs.sdk-dir }}
        run: |
          ipks=(pkg/com.seergi893.cineusb_*_arm.ipk)
          ipk="${ipks[0]}"
          version="${ipk#pkg/com.seergi893.cineusb_}"
          version="${version%_arm.ipk}"
          cargo +"$RUST_TOOLCHAIN" fetch --locked --manifest-path rust-modules/Cargo.toml
          rustup component add rust-src --toolchain "$RUST_TOOLCHAIN"
          printf '[]\n' > "$RUNNER_TEMP/cineusb-private-values.json"
          python3 ci/prepare-source-release.py --inputs "$RUNNER_TEMP/cineusb-source-inputs" \
            --output "pkg/cineusb-source-$version.tar.gz" --binary "$ipk" \
            --private-values "$RUNNER_TEMP/cineusb-private-values.json"
          cp "$(python3 ci/deps.py fetch ffmpeg)" pkg/
          cp ci/build-ffmpeg.sh pkg/
          echo "CINEUSB_VERSION=$version" >> "$GITHUB_ENV"
      - name: Publish the complete release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cineusb-v$CINEUSB_VERSION"
          gh release create "$tag" --target "$GITHUB_SHA" --draft \
            --title "CineUSB $CINEUSB_VERSION · Biblioteca USB" \
            --notes "Biblioteca USB para webOS con navegación por carpetas y reproductor integrado. El código fuente correspondiente y la receta de compilación acompañan al paquete." \
            pkg/com.seergi893.cineusb_*_arm.ipk pkg/com.seergi893.cineusb.manifest.json \
            pkg/ipk.sha256 pkg/cineusb-source-*.tar.gz pkg/cineusb-source-*.tar.gz.release.json \
            pkg/ffmpeg-*.tar.xz pkg/build-ffmpeg.sh
          gh release edit "$tag" --draft=false --latest
