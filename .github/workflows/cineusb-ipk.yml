name: Build and publish CineUSB

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cineusb-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  usb-smoke:
    if: github.repository == 'seergi893/cineusb'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate automatic release metadata on every PR
        run: python3 ci/prepare-automatic-release.py --check-metadata
      - uses: ./.github/actions/rust-toolchain
      - name: Check architecture, notices and pipeline regressions
        run: |
          python3 ci/test_cineusb_pipeline.py
          python3 ci/test_native_cache.py
          python3 ci/test_deps_update.py
          python3 ci/test_libass_fetch.py
          python3 ci/test_cargo_seed.py
          python3 ci/test_link_evidence.py
          python3 ci/check-module-layers.py
          python3 ci/gen-third-party-notices.py --check
      - name: Cache host Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-modules/target
          key: cineusb-cargo-host-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-modules/rust-toolchain.toml', 'rust-modules/Cargo.lock', 'rust-modules/**/Cargo.toml', 'rust-modules/.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            cineusb-cargo-host-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-modules/rust-toolchain.toml', 'rust-modules/Cargo.lock', 'rust-modules/**/Cargo.toml', 'rust-modules/.cargo/config.toml') }}-
      - name: Discard cached workspace outputs
        run: python3 ci/cargo-cache.py rust-modules/target
      - name: Cache host FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/ffmpeg-prefix-host
          key: cineusb-ffmpeg-host-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/dependencies.json', 'ci/build-ffmpeg.sh', 'ci/deps.py', 'ci/arm-cc.py', 'ci/check-link-evidence.py', 'ci/stage-link-evidence.py') }}
      - name: Install USB test dependencies
        id: usb-deps
        run: |
          if ! command -v ffmpeg || ! command -v nasm || ! pkg-config --exists sdl2 SDL2_ttf gl; then
            sources="$RUNNER_TEMP/cineusb-ubuntu.sources"
            apt_options=(
              -o "Dir::Etc::sourcelist=$sources"
              -o Dir::Etc::sourceparts=-
              -o Acquire::ForceIPv4=true
              -o Acquire::Retries=0
              -o Acquire::http::Timeout=12
              -o Acquire::https::Timeout=12
            )
            installed=false
            for mirror in archive.ubuntu.com mirrors.mit.edu; do
              if ! timeout 12s getent ahostsv4 "$mirror" >/dev/null; then
                echo "::warning::Runner could not resolve $mirror"
                continue
              fi
              cat > "$sources" <<APT_SOURCES
          Types: deb
          URIs: https://$mirror/ubuntu/
          Suites: noble noble-updates noble-backports noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          APT_SOURCES
              echo "Installing USB test dependencies from $mirror"
              if sudo timeout 90s apt-get "${apt_options[@]}" update -o APT::Update::Error-Mode=any &&
                 sudo timeout 90s env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install --no-install-recommends -y ffmpeg nasm libsdl2-dev libsdl2-ttf-dev libgl1-mesa-dev; then
                installed=true
                break
              fi
            done
            if [ "$installed" != true ]; then
              echo "::warning::Ubuntu dependencies unavailable; USB smoke tests cannot run. Check runner network/APT logs."
              echo "### USB smoke tests NOT RUN" >> "$GITHUB_STEP_SUMMARY"
              echo "Host dependencies could not be installed; no USB smoke tests were executed. This is not a passing test result." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          pkg-config --exists sdl2 SDL2_ttf gl
          command -v ffmpeg
          command -v nasm
      - name: Test local MKV and MP4 with the bundled FFmpeg configuration
        run: |
          HOST=1 RELEASE=1 ci/build-ffmpeg.sh
          export PLXNATIVE_APP_DIR="$PWD/vendor/ffmpeg-prefix-host/lib"
          export PLX_FFMPEG_DIR="$PLXNATIVE_APP_DIR"
          export CINEUSB_FD_FIXTURES="$RUNNER_TEMP/cineusb-fd-fixtures"
          mkdir -p "$CINEUSB_FD_FIXTURES"
          for ext in mkv mp4; do
            ffmpeg -nostdin -v error -f lavfi -i color=size=160x90:rate=24 \
              -f lavfi -i anullsrc=r=48000:cl=stereo -t 1 -c:v libx264 -c:a aac \
              -color_trc bt709 -colorspace bt709 -color_primaries bt709 \
              "$CINEUSB_FD_FIXTURES/Película.$ext"
          done
          printf '1\n00:00:00,100 --> 00:00:00,800\nFull subtitle\n' > "$CINEUSB_FD_FIXTURES/full.srt"
          printf '1\n00:00:00,200 --> 00:00:00,900\nSigns subtitle\n' > "$CINEUSB_FD_FIXTURES/signs.srt"
          ffmpeg -nostdin -v error -f lavfi -i color=size=160x90:rate=24 \
            -f lavfi -i anullsrc=r=48000:cl=stereo \
            -i "$CINEUSB_FD_FIXTURES/full.srt" -i "$CINEUSB_FD_FIXTURES/signs.srt" \
            -t 1 -map 0:v -map 1:a -map 2:0 -map 3:0 \
            -c:v libx264 -c:a aac -c:s srt \
            -metadata:s:s:0 language=spa -metadata:s:s:0 title=Full \
            -metadata:s:s:1 language=eng -metadata:s:s:1 title=Signs \
            -disposition:s:0 default -disposition:s:1 forced \
            "$CINEUSB_FD_FIXTURES/subtitled.mkv"
          printf 'Not a Matroska file\n' > "$CINEUSB_FD_FIXTURES/invalid.mkv"
          cd rust-modules
          CARGO_INCREMENTAL=0 cargo +"$RUST_TOOLCHAIN" test --locked -p plx_play_feed --lib --features plx_base/hostsim \
            cineusb_ -- --nocapture
          CARGO_INCREMENTAL=0 cargo +"$RUST_TOOLCHAIN" test --locked -p plx_play_feed --lib --features test-support \
            dts_to_ac3_preserves_all_six_speakers_and_timestamps -- --ignored
          CARGO_INCREMENTAL=0 cargo +"$RUST_TOOLCHAIN" test --locked -p plxnative-storage --bin plxnative-storage usb_
      - name: Test USB video menu and startup subtitles
        run: |
          cd rust-modules
          CARGO_INCREMENTAL=0 cargo +"$RUST_TOOLCHAIN" test --locked -p plxnative-modules --lib \
            --no-default-features --features hostsim,local-usb usb_browser_tests::
          # Appkit's own test harness enables its diagnostic probes. Run it alone
          # so Cargo cannot unify those features into the release-shaped app test.
          CARGO_INCREMENTAL=0 cargo +"$RUST_TOOLCHAIN" test --locked -p plx_appkit --lib \
            --features plx_media/hostsim,plx_gfx/hostsim cineusb_
      - name: Test the platform USB interface
        run: |
          cd rust-modules
          cargo +"$RUST_TOOLCHAIN" test --locked -p plx_platform --lib --features hostsim tv::usb::tests
      - name: Lint the USB storage helper
        working-directory: rust-modules
        run: |
          cargo +"$RUST_TOOLCHAIN" clippy --locked -p plxnative-storage --tests -- \
            -A clippy::all \
            -D clippy::ifs_same_cond -D clippy::same_functions_in_if_condition -D clippy::if_same_then_else
  package:
    if: ${{ !cancelled() && github.repository == 'seergi893/cineusb' && needs.usb-smoke.result == 'success' }}
    needs: usb-smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      FLAVOR: stable
      RELEASE: "1"
      PLAYBACK_BACKENDS: both
      WEBOS_SDK: ${{ github.workspace }}/.webos-ndk/arm-webos-linux-gnueabi_sdk-buildroot
      PLX_SENTRY_DSN: ""
      PLX_POSTHOG_KEY: ""
      PLX_SENTRY_DSN_DEV: ""
      PLX_POSTHOG_KEY_DEV: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare and commit the automatic release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Checkout is detached by default for push events. Work on main so the
          # generated version/docs are committed as part of the published source.
          git checkout -B main "$GITHUB_SHA"
          python3 ci/prepare-automatic-release.py
          git add pkg/appinfo.json ipkroot/ctl/control rust-modules/Cargo.toml rust-modules/Cargo.lock docs/release-notes docs/release-audits
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(release): prepare automatic CineUSB release"
            # The workflow token does not trigger another push workflow, so
            # the current run builds the committed version exactly once.
            git push origin HEAD:main
          fi
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/webos-ndk
        id: ndk
      - name: Initialize the stable build configuration
        run: make ci-config release-guard
      - name: Cache ARM Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-modules/target-release
            rust-modules/target-release-storage
          key: cineusb-cargo-arm-both-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-modules/rust-toolchain.toml', 'rust-modules/Cargo.lock', 'rust-modules/**/Cargo.toml', 'rust-modules/.cargo/config.toml', 'Makefile', 'ci/dependencies.json') }}-${{ github.sha }}
          restore-keys: |
            cineusb-cargo-arm-both-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-modules/rust-toolchain.toml', 'rust-modules/Cargo.lock', 'rust-modules/**/Cargo.toml', 'rust-modules/.cargo/config.toml', 'Makefile', 'ci/dependencies.json') }}-
      - name: Discard cached workspace outputs
        run: python3 ci/cargo-cache.py rust-modules/target-release rust-modules/target-release-storage
      - name: Cache verified native dependencies
        id: native-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor/ffmpeg-prefix
            vendor/libass-prefix
            vendor/sentry-native-prefix
            pkg/lib*-plx.so.*
            .cineusb-native-cache.json
          key: cineusb-native-stable-both-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/dependencies.json', 'ci/build-*', 'ci/deps.py', 'ci/arm-cc.py', 'ci/check-link-evidence.py', 'ci/stage-link-evidence.py', 'ci/native-cache.py', 'ci/patches/**', 'Makefile', 'rust-modules/.cargo/config.toml') }}
      - name: Verify restored native cache
        if: steps.native-cache.outputs.cache-hit == 'true'
        env:
          CACHE_KEY: cineusb-native-stable-both-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/dependencies.json', 'ci/build-*', 'ci/deps.py', 'ci/arm-cc.py', 'ci/check-link-evidence.py', 'ci/stage-link-evidence.py', 'ci/native-cache.py', 'ci/patches/**', 'Makefile', 'rust-modules/.cargo/config.toml') }}
        run: python3 ci/native-cache.py verify "$CACHE_KEY"
      - name: Compile and verify the webOS package
        env:
          NATIVE_CACHE_HIT: ${{ steps.native-cache.outputs.cache-hit }}
          CACHE_KEY: cineusb-native-stable-both-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/dependencies.json', 'ci/build-*', 'ci/deps.py', 'ci/arm-cc.py', 'ci/check-link-evidence.py', 'ci/stage-link-evidence.py', 'ci/native-cache.py', 'ci/patches/**', 'Makefile', 'rust-modules/.cargo/config.toml') }}
          WEBOS_SDK: ${{ steps.ndk.outputs.sdk-dir }}
        run: |
          export JOBS="$(python3 -c 'import os; print(max(1, (os.cpu_count() or 2) // 2))')"
          # Cold native sub-builds each have their own bounded worker pool.
          # With verified native outputs, Cargo can use the full Make jobserver.
          parallel=2
          if [ "$NATIVE_CACHE_HIT" = true ]; then parallel="$(nproc)"; fi
          make -j"$parallel" all
          make ipk
          python3 ci/native-cache.py seal "$CACHE_KEY"
      - name: Upload the test IPK
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cineusb-webos-arm
          path: pkg/com.seergi893.cineusb_*_arm.ipk
          if-no-files-found: error
      - name: Generate and verify the Homebrew manifest
        if: github.ref == 'refs/heads/main'
        run: |
          packages=$(python3 ci/deps.py fetch webosbrew-toolbox --asset fw-symbols --asset ipk-verify --asset gen-manifest)
          mapfile -t debs <<< "$packages"
          sudo apt-get install -y "${debs[@]}"
          ipks=(pkg/com.seergi893.cineusb_*_arm.ipk)
          test "${#ipks[@]}" = 1
          ipk="${ipks[0]}"
          webosbrew-ipk-verify --details --format markdown --fw-releases '>=4.0' "$ipk" | tee "$GITHUB_STEP_SUMMARY"
          manifest=pkg/com.seergi893.cineusb.manifest.json
          webosbrew-gen-manifest -p "$ipk" \
            -i "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/pkg/largeIcon.png" \
            -l "https://github.com/$GITHUB_REPOSITORY" -r true -o "$manifest"
          python3 - "$ipk" "$manifest" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          ipk, manifest = map(Path, sys.argv[1:])
          info = json.loads(manifest.read_text())
          assert info["id"] == "com.seergi893.cineusb"
          assert ipk.name == f'{info["id"]}_{info["version"]}_arm.ipk'
          assert info["ipkUrl"] == ipk.name
          assert info["ipkHash"]["sha256"] == hashlib.sha256(ipk.read_bytes()).hexdigest()
          assert info["rootRequired"] is True
          PY
      - name: Prepare matching source and build instructions
        if: github.ref == 'refs/heads/main'
        env:
          WEBOS_SDK: ${{ steps.ndk.outputs.sdk-dir }}
        run: |
          ipks=(pkg/com.seergi893.cineusb_*_arm.ipk)
          ipk="${ipks[0]}"
          version="${ipk#pkg/com.seergi893.cineusb_}"
          version="${version%_arm.ipk}"
          # A native cache hit skips builds that normally populate these archives.
          # Fetch and verify pinned inputs before the offline source collector.
          python3 ci/deps.py fetch-all --exclude webos-ndk
          cargo +"$RUST_TOOLCHAIN" fetch --locked --manifest-path rust-modules/Cargo.toml
          rustup component add rust-src --toolchain "$RUST_TOOLCHAIN"
          printf '[]\n' > "$RUNNER_TEMP/cineusb-private-values.json"
          python3 ci/prepare-source-release.py --inputs "$RUNNER_TEMP/cineusb-source-inputs" \
            --output "pkg/cineusb-source-$version.tar.gz" --binary "$ipk" \
            --private-values "$RUNNER_TEMP/cineusb-private-values.json"
          cp "$(python3 ci/deps.py fetch ffmpeg)" pkg/
          cp ci/build-ffmpeg.sh pkg/
          echo "CINEUSB_VERSION=$version" >> "$GITHUB_ENV"
      - name: Publish the complete release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cineusb-v$CINEUSB_VERSION"
          gh release create "$tag" --target "$(git rev-parse HEAD)" --draft \
            --title "CineUSB $CINEUSB_VERSION · Biblioteca USB" \
            --notes "Biblioteca USB para webOS con navegación por carpetas y reproductor integrado. El código fuente correspondiente y la receta de compilación acompañan al paquete." \
            pkg/com.seergi893.cineusb_*_arm.ipk pkg/com.seergi893.cineusb.manifest.json \
            pkg/ipk.sha256 pkg/cineusb-source-*.tar.gz pkg/cineusb-source-*.tar.gz.release.json \
            pkg/ffmpeg-*.tar.xz pkg/build-ffmpeg.sh
          gh release edit "$tag" --draft=false --latest
