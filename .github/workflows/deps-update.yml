name: Review native dependency updates
on:
  push:
    branches: [main]
    paths:
      - ci/dependencies.json
  schedule:
    - cron: '25 7 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: cineusb-dependency-updates
  cancel-in-progress: false
jobs:
  discover:
    if: github.event_name != 'push'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.updates.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 ci/deps-update.py --list-outdated > "$RUNNER_TEMP/updates.tsv"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows = [line.split('\t') for line in Path(os.environ['RUNNER_TEMP'], 'updates.tsv').read_text().splitlines()]
          matrix = [{'id': name, 'version': version} for name, version in rows]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix) + '\n')
          PY
  propose:
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        dependency: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Propose one reviewed update; never merge automatically
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          DEPENDENCY: ${{ matrix.dependency.id }}
          VERSION: ${{ matrix.dependency.version }}
        run: python3 ci/propose-dependency.py
  graph:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Submit the pinned native dependency graph
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_REF: ${{ github.ref }}
        run: |
          python3 ci/deps-update.py --snapshot --sha "$COMMIT_SHA" --ref "$COMMIT_REF" > "$RUNNER_TEMP/snapshot.json"
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input "$RUNNER_TEMP/snapshot.json"
