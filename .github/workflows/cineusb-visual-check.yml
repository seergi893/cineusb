name: CineUSB native card captures
on:
  push:
    branches: [codex/cineusb-card-visual-check]
permissions:
  contents: read
concurrency:
  group: cineusb-native-card-captures
  cancel-in-progress: true
jobs:
  captures:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: vendor/ffmpeg-prefix-host
          key: cineusb-ffmpeg-host-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/dependencies.json', 'ci/build-ffmpeg.sh', 'ci/deps.py', 'ci/arm-cc.py', 'ci/check-link-evidence.py', 'ci/stage-link-evidence.py') }}
      - name: Install simulator prerequisites
        run: |
          for mirror in archive.ubuntu.com mirrors.mit.edu; do
            sources="$RUNNER_TEMP/visual.sources"
            printf 'Types: deb\nURIs: https://%s/ubuntu/\nSuites: noble noble-updates noble-security\nComponents: main universe\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n' "$mirror" > "$sources"
            opts=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=- -o Acquire::ForceIPv4=true -o Acquire::Retries=0 -o Acquire::https::Timeout=12)
            if sudo timeout 90s apt-get "${opts[@]}" update -o APT::Update::Error-Mode=any &&
              sudo timeout 90s apt-get "${opts[@]}" install --no-install-recommends -y ffmpeg nasm libsdl2-dev libsdl2-ttf-dev libgl1-mesa-dev xvfb xauth; then exit 0; fi
          done
          exit 1
      - name: Compile the Linux USB simulator and bundled FFmpeg
        run: |
          HOST=1 RELEASE=1 ci/build-ffmpeg.sh
          cd rust-modules
          CARGO_INCREMENTAL=0 cargo +"$RUST_TOOLCHAIN" build --profile tvdev --locked -p plxnative-modules --bin plxnative-sim --no-default-features --features hostsim,local-usb,devtriggers,play-feed
          CARGO_INCREMENTAL=0 cargo +"$RUST_TOOLCHAIN" check --locked -p plxnative-modules --lib --no-default-features --features play-uri,play-feed,local-usb
      - name: Capture the native renderer with networking disabled
        run: |
          mkdir -p "$RUNNER_TEMP/card-shots"
          ci/cineusb-visual-fixtures.sh "$RUNNER_TEMP"
          sudo -n unshare --net -- runuser -u "$(id -un)" -- env LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=x11 xvfb-run -a -s '-screen 0 1920x1080x24' ci/cineusb-visual-run.sh "$RUNNER_TEMP" "$PWD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cineusb-native-card-captures
          path: ${{ runner.temp }}/card-shots
          if-no-files-found: error
