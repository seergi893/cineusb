name: CineUSB native card captures
on:
  push:
    branches: [codex/cineusb-card-visual-check]
permissions:
  contents: read
jobs:
  captures:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - name: Install simulator prerequisites
        run: |
          for try in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=2 update && sudo apt-get -o Acquire::Retries=2 install --no-install-recommends -y ffmpeg nasm libsdl2-dev libsdl2-ttf-dev libgl1-mesa-dev xvfb xauth; then exit 0; fi
          done
          exit 1
      - name: Compile the Linux USB simulator and bundled FFmpeg
        run: |
          HOST=1 RELEASE=1 ci/build-ffmpeg.sh
          cd rust-modules
          CARGO_INCREMENTAL=0 cargo +"$RUST_TOOLCHAIN" build --locked -p plxnative-modules --bin plxnative-sim --no-default-features --features hostsim,local-usb,devtriggers,play-feed
          CARGO_INCREMENTAL=0 cargo +"$RUST_TOOLCHAIN" check --locked -p plxnative-modules --lib --no-default-features --features play-uri,play-feed,local-usb
      - name: Capture the native renderer with networking disabled
        run: |
          mkdir -p "$RUNNER_TEMP/card-shots"
          ci/cineusb-visual-fixtures.sh "$RUNNER_TEMP"
          sudo -n unshare --net -- runuser -u "$USER" -- +            env LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=x11 +            xvfb-run -a -s '-screen 0 1920x1080x24' +            ci/cineusb-visual-run.sh "$RUNNER_TEMP" "$PWD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cineusb-native-card-captures
          path: ${{ runner.temp }}/card-shots
          if-no-files-found: error
